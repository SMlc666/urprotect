plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.urprotect'
    ndkVersion '27.2.12479018'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.urprotect'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
