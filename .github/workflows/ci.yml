name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_android_native_bridge:
        description: >-
          Run the slow x86_64 Android AVD native-bridge E2E (scheduled and
          release runs always execute it).
        required: false
        default: false
        type: boolean
      run_release_rehearsal:
        description: Run the ARM64 release packaging and smoke validation without publishing release assets.
        required: false
        default: false
        type: boolean
      run_nightly_rehearsal:
        description: Run the full nightly real-sample and fixture evidence tiers without waiting for the schedule.
        required: false
        default: false
        type: boolean
      run_release_fixtures:
        description: Run the release-tier compatibility fixture and evidence gates without publishing a release.
        required: false
        default: false
        type: boolean
      capture_bionic_node_closure:
        description: >-
          Manually capture a reviewed candidate-lock for the Termux/bionic Node.js
          dependency closure; this never establishes compatibility support.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * *'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: urprotect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Skip heavy Push verification only if a matching open PR is proven.
  # PR, schedule, release and manual validation always execute in full.
  ci-event-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_full: ${{ steps.decision.outputs.run_full }}
    steps:
      - name: Find an exact same-head open PR
        id: pr-probe
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            if (!context.ref.startsWith('refs/heads/')) return 'run';
            const branch = context.ref.slice('refs/heads/'.length);
            // Never suppress verification of the repository default branch.
            if (branch === context.payload.repository?.default_branch) return 'run';
            const fullName = (owner + '/' + repo).toLowerCase();
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: owner + ':' + branch,
              per_page: 100
            });
            const match = pulls.find(pr =>
              pr.state === 'open' &&
              pr.head.ref === branch &&
              pr.head.sha === context.sha &&
              pr.head.repo?.full_name?.toLowerCase() === fullName &&
              pr.base.repo?.full_name?.toLowerCase() === fullName
            );
            if (match) {
              core.info('Exact open PR #' + match.number + ' covers ' + context.sha);
              return 'skip';
            }
            return 'run';
      - name: Decide full verification (probe failure means full CI)
        id: decision
        if: always()
        shell: bash
        env:
          PROBE_RESULT: ${{ steps.pr-probe.outputs.result }}
          PROBE_OUTCOME: ${{ steps.pr-probe.outcome }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == push &&
                "${PROBE_OUTCOME}" == success &&
                "${PROBE_RESULT}" == skip ]]; then
            echo 'run_full=false' >> "$GITHUB_OUTPUT"
            echo 'Exact open PR: duplicate Push heavy checks omitted.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'run_full=true' >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_EVENT_NAME}" == push && "${PROBE_OUTCOME}" != success ]]; then
              echo 'PR API unavailable: full Push validation retained.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Full validation is required.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
  build-and-test:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' }}
    needs: ci-event-gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p .artifacts/environment
          ./.github/scripts/record-environment.sh \
            .artifacts/environment/build-and-test.txt \
            aarch64 native-linux-glibc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            tests/UrProtect.Fuzz/packages.lock.json
            third_party/SharpFuzzCompat/SharpFuzz/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      # Additive producer evidence only: this stage is not a strict compatibility claim.
      - name: Run required bionic Node.js Python contracts
        run: |
          python3 tests/test_bionic_node_runner.py
          python3 tests/test_bionic_node_runtime_lock.py
          python3 tests/test_bionic_node_closure.py
          python3 tests/test_real_sample_worker.py
          tests/test_real_sample_worker_cleanup.sh
      - name: Check explicit protection policy
        run: python3 scripts/validate-protection-policy.py fixtures/real-samples/protection-policy.json
      - name: Run required glibc protection smoke
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          PROTECTION_ARTIFACT_ROOT=".artifacts/protection/${tier}/glibc" \
            ./scripts/run-protection-e2e.sh --tier "${tier}" --runtime glibc
      - name: Check glibc protection evidence
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          python3 scripts/check-protection-evidence.py \
            ".artifacts/protection/${tier}/glibc" --tier "${tier}" --runtime glibc
      - name: Check compatibility matrix contract
        run: python3 tests/test_fixture_matrix.py
      - name: Check managed architecture boundaries
        run: |
          python3 scripts/check-architecture-boundaries.py --self-test
          python3 scripts/check-aarch64-encoding-boundary.py
          python3 tests/test_aarch64_encoding_boundary.py
      - name: Check regression matrix contract
        run: python3 tests/test_regression_matrix.py
      - name: Check runtime covering matrix
        run: |
          python3 tests/test_runtime_matrix.py
          python3 scripts/validate-runtime-matrix.py fixtures/runtime-matrix.json
          python3 tests/test_runtime_closures.py
          python3 scripts/validate-runtime-closures.py \
            fixtures/real-samples/runtime-closures.json \
            fixtures/real-samples/manifest.json
      - name: Render PR regression matrix plan
        run: |
          mkdir -p .artifacts/regression-matrix/pr
          python3 scripts/validate-regression-matrix.py tests/regression-matrix.json \
            --tier pr --emit > .artifacts/regression-matrix/pr/plan.json
      - name: Contract and stress smoke
        run: |
          ./scripts/run-regression-stress.sh --tier pr
          make -C native/urprotect-runtime contract-check
      - name: Render compatibility matrix
        run: |
          python3 scripts/validate-fixtures.py fixtures/manifest.json --tier pr
          python3 scripts/render-compatibility-matrix.py \
            fixtures/manifest.json --output .artifacts/compatibility-matrix.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("fixtures/manifest.json").read_text())
          feature = next(
              item for item in manifest["features"]
              if item["id"] == "runtime.host-context.bionic-handoff"
          )
          if feature["status"] != "validated":
              raise SystemExit("bionic HostContext handoff must remain validated only with its dedicated oracle")
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_id }}
          path: |
            .artifacts/stress/
            .artifacts/regression-matrix/
            .artifacts/environment/
            .artifacts/compatibility-matrix.md
            .artifacts/protection/
          include-hidden-files: true
          if-no-files-found: warn


  # Native product evidence is still produced and checked on the target host,
  # but does not block the managed test/fixture/fuzz lanes.
  # Run all managed tests and the unchanged coverage collector/floor on
  # an independent ARM64 runner. The local solution build avoids cross-job
  # artifact dependencies, keeping the verification DAG flat.
  managed-tests:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' }}
    needs: ci-event-gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p .artifacts/environment
          ./.github/scripts/record-environment.sh \
            .artifacts/environment/managed-tests.txt \
            aarch64 native-linux-glibc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            tests/UrProtect.Fuzz/packages.lock.json
            third_party/SharpFuzzCompat/SharpFuzz/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      # Additive producer evidence only: this stage is not a strict compatibility claim.
      - name: Test
        run: dotnet test UrProtect.sln --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage"
      - name: Check coverage floor
        run: python3 scripts/check-coverage.py
      - name: Verify Push/PR dedup policy regressions
        run: python3 tests/test_ci_push_pr_dedup.py
      - name: Upload managed test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-test-evidence-${{ github.run_id }}
          path: |
            tests/**/TestResults/**
            .artifacts/environment/
          include-hidden-files: true
          if-no-files-found: error

  protection-and-tls:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' }}
    needs: ci-event-gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p .artifacts/environment
          ./.github/scripts/record-environment.sh \
            .artifacts/environment/protection-and-tls.txt \
            aarch64 native-linux-glibc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            tests/UrProtect.Fuzz/packages.lock.json
            third_party/SharpFuzzCompat/SharpFuzz/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      # Additive producer evidence only: this stage is not a strict compatibility claim.
      - name: Run Protected Image producer evidence (additive, not strict compatibility)
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          ./scripts/run-protected-image-e2e.sh --tier "${tier}" --runtime glibc
      - name: Check retained Protected Image producer evidence
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          python3 scripts/check-protected-image-evidence.py \
            ".artifacts/protected-image/${tier}/glibc/compat.protection-symbolized-fixture.glibc.outer-execveat" \
            --tier "${tier}" --runtime glibc \
            --unit compat.protection-symbolized-fixture.glibc.outer-execveat
      - name: Run Generic Rehydration and Native Image handoff (additive; evaluator remains incomplete)
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          ./scripts/run-rehydration-e2e.sh --tier "${tier}" --runtime glibc
      - name: Check retained Generic Rehydration and Native Image evidence
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          python3 scripts/check-rehydration-evidence.py \
            ".artifacts/protected-image/${tier}/glibc/compat.protection-symbolized-fixture.glibc.outer-execveat" \
            --tier "${tier}" --runtime glibc \
            --unit compat.protection-symbolized-fixture.glibc.outer-execveat
      - name: Run HostContext Generic Rehydration and Native Image handoff (additive)
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          ./scripts/run-rehydration-e2e.sh --tier "${tier}" --runtime glibc --profile host-context-entry
      - name: Check retained HostContext Generic Rehydration evidence
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          python3 scripts/check-rehydration-evidence.py \
            ".artifacts/protected-image/${tier}/glibc/compat.protection-host-context-fixture.glibc.host-context-entry" \
            --tier "${tier}" --runtime glibc \
            --unit compat.protection-host-context-fixture.glibc.host-context-entry
      - name: Run managed TLS initial-exec transformed-image evidence
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          ./scripts/run-tls-host-context-rehydration-e2e.sh \
            --tier "${tier}" \
            --unit tls.initial-exec.glibc.host-context-entry
      - name: Check managed TLS initial-exec transformed-image evidence
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.protected-image-tls-initial-exec
          python3 scripts/check-protected-image-evidence.py \
            ".artifacts/protected-image/tls/tls.initial-exec.glibc.host-context-entry" \
            --tier "${tier}" --runtime glibc \
            --unit tls.initial-exec.glibc.host-context-entry
          python3 scripts/check-rehydration-evidence.py \
            ".artifacts/protected-image/tls/tls.initial-exec.glibc.host-context-entry" \
            --tier "${tier}" --runtime glibc \
            --unit tls.initial-exec.glibc.host-context-entry
      - name: Run TLS prerequisite probes
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          NATIVE_LAUNCHER_CC=cc \
            python3 scripts/run-tls-prerequisite-probes.py \
            --tier "${tier}" \
            --artifact-root ".artifacts/tls-prerequisites/${tier}"
          python3 scripts/check-tls-prerequisite-evidence.py \
            ".artifacts/tls-prerequisites/${tier}"

      - name: Run independent transformed TLS runtime matrix
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          NATIVE_LAUNCHER_CC=cc \
            python3 scripts/run-tls-runtime-matrix.py \
            --tier "${tier}" \
            --artifact-root ".artifacts/tls-runtime/${tier}"

      - name: Check transformed TLS runtime matrix
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          python3 scripts/check-tls-runtime-matrix-evidence.py \
            ".artifacts/tls-runtime/${tier}" \
            --registry fixtures/tls-runtime-matrix.json

      - name: Check TLS feature evidence declarations
        if: always()
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          if [[ "${tier}" != pr ]]; then
            rm -rf .artifacts/tls-prerequisites/pr .artifacts/tls-runtime/pr
            mkdir -p .artifacts/tls-prerequisites .artifacts/tls-runtime
            cp -a ".artifacts/tls-prerequisites/${tier}" .artifacts/tls-prerequisites/pr
            cp -a ".artifacts/tls-runtime/${tier}" .artifacts/tls-runtime/pr
          fi
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.tls-prerequisite-probes
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.tls-transformed-runtime-matrix

      - name: Upload protection-tls evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protection-tls-evidence-${{ github.run_id }}
          path: |
            .artifacts/protected-image/
            .artifacts/tls-prerequisites/
            .artifacts/tls-runtime/
            .artifacts/environment/
            /tmp/urprotect-*.out
            /tmp/urprotect-*.err
          include-hidden-files: true
          if-no-files-found: warn


  # Fixtures and packed fixture handoff share the same runner by design.
  # Their evidence must pass its original strict local gates.
  fixture-and-pack:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' }}
    needs: ci-event-gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p .artifacts/environment
          ./.github/scripts/record-environment.sh \
            .artifacts/environment/fixture-and-pack.txt \
            aarch64 native-linux-glibc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            tests/UrProtect.Fuzz/packages.lock.json
            third_party/SharpFuzzCompat/SharpFuzz/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      # Additive producer evidence only: this stage is not a strict compatibility claim.
      - name: Fixture smoke
        run: ./scripts/run-fixture-matrix.sh --tier pr
      - name: Check PR fixture evidence
        run: python3 scripts/check-evidence.py fixtures/manifest.json --tier pr --execution native-linux
      - name: Install pinned native launcher toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make musl=1.2.4-2 musl-dev=1.2.4-2 musl-tools=1.2.4-2
      - name: Packed fixture smoke
        run: |
          mkdir -p .artifacts/packed/pr
          ./scripts/run-packed-fixture-matrix.sh --tier pr \
            2>&1 | tee .artifacts/packed/pr/handoff.log
      - name: Check PR handoff evidence
        run: |
          python3 scripts/check-evidence.py fixtures/manifest.json --feature handoff.no-executable-path
          python3 scripts/check-evidence.py fixtures/manifest.json --feature elf.outer.dynamic-et-exec
      - name: Upload fixture-pack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-pack-evidence-${{ github.run_id }}
          path: |
            .artifacts/fixtures/pr/
            .artifacts/packed/pr/
            .artifacts/environment/
          include-hidden-files: true
          if-no-files-found: warn


  # HostContext native tests and the managed packaging oracle remain adjacent:
  # they share the same native make outputs but no other job's mutable state.
  native-host-context:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' }}
    needs: ci-event-gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p .artifacts/environment
          ./.github/scripts/record-environment.sh \
            .artifacts/environment/native-host-context.txt \
            aarch64 native-linux-glibc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            tests/UrProtect.Fuzz/packages.lock.json
            third_party/SharpFuzzCompat/SharpFuzz/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      # Additive producer evidence only: this stage is not a strict compatibility claim.
      - name: HostContext runtime contract smoke
        run: |
          set -o pipefail
          mkdir -p .artifacts/host-context/pr
          make -C native/urprotect-runtime dependency-fixture
          cp native/urprotect-runtime/build/host-context-dependency-fixture.so \
            .artifacts/host-context/pr/
          readelf -aW native/urprotect-runtime/build/host-context-dependency-fixture.so \
            > .artifacts/host-context/pr/dependency-fixture-readelf.txt
          make -C native/urprotect-runtime test \
            2>&1 | tee .artifacts/host-context/pr/self-test.log
      - name: Managed HostContext packaging oracle
        run: |
          set -o pipefail
          MANAGED_HOST_CONTEXT_ARTIFACT_ROOT=.artifacts/host-context/managed \
            native/urprotect-runtime/test_managed_host_context.sh \
            2>&1 | tee .artifacts/host-context/pr/managed-pack.log
      - name: Check PR HostContext evidence
        run: |
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.pt-tls
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.threaded-initial-exec-tls
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.gnu-property
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.dependency-resolution
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.weak-undefined-jump-slot
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.dependency-symbol-version-requirements
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.bounded-glibc-loader-dependency
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.symbol-version
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.constructor-destructor
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.path-search
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.text-relocation
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.unsupported-relocation-table
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.sectionless-image
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.gnu-relro
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.gnu-stack
          python3 scripts/check-evidence.py fixtures/manifest.json --feature elf.relocation.aarch64-relative
          python3 scripts/check-evidence.py fixtures/manifest.json --feature runtime.host-context.production-pack
          python3 scripts/check-evidence.py fixtures/manifest.json --feature elf.symbol-version.requirements
      - name: Upload native-host-context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-host-context-evidence-${{ github.run_id }}
          path: |
            .artifacts/host-context/
            .artifacts/environment/
          include-hidden-files: true
          if-no-files-found: warn


  # Fuzz instrumentation/publish has independent writable build products.
  coverage-fuzz:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' }}
    needs: ci-event-gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p .artifacts/environment
          ./.github/scripts/record-environment.sh \
            .artifacts/environment/coverage-fuzz.txt \
            aarch64 native-linux-glibc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            tests/UrProtect.Fuzz/packages.lock.json
            third_party/SharpFuzzCompat/SharpFuzz/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      # Additive producer evidence only: this stage is not a strict compatibility claim.
      - name: Coverage-guided fuzz smoke
        run: ./scripts/run-coverage-fuzz.sh --tier pr
      - name: Upload coverage-fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fuzz-evidence-${{ github.run_id }}
          path: |
            .artifacts/fuzz/
            .artifacts/environment/
          include-hidden-files: true
          if-no-files-found: warn

  # The current approved public real-sample slice is a required full-corpus gate on every PR.
  # Scheduled and release runs reuse the exact registry/orchestrator and only
  # change the tier's retention/repeat policy; they never select a subset.
  # Shards run on independent native ARM64 runners. No test coverage is dropped:
  # every registered unit is allocated exactly once and validated before evaluation.
  strict-compatibility-shard:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' }}
    needs: ci-event-gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      - name: Validate shard partition and worker orchestration contracts
        run: |
          python3 tests/test_strict_corpus_shards.py
          python3 tests/test_strict_corpus_runner.py
      - name: Execute strict compatibility shard
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          ./scripts/run-strict-compatibility-corpus.sh \
            --tier "${tier}" --runtime glibc \
            --shard-index "${{ matrix.shard }}" --shard-count 4 \
            --workers 2
      - name: Upload strict compatibility shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-compatibility-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: .artifacts/protected-image/
          include-hidden-files: true
          if-no-files-found: error

  real-sample-matrix:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      REAL_SAMPLE_CI: 'true'
      REAL_SAMPLE_PARALLELISM: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Restore real-sample package and index cache
        id: real-sample-package-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/urprotect-real-sample-package-cache/archives
            ${{ runner.temp }}/urprotect-real-sample-package-cache/indexes
          key: real-sample-package-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fixtures/real-samples/runtime-closures.json', 'fixtures/real-samples/bionic-node-runtime-lock.json', 'fixtures/real-samples/manifest.json', 'scripts/build-runtime-closure.py', 'scripts/run-bionic-node-sample.sh') }}
          restore-keys: |
            real-sample-package-cache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Record real-sample package cache status
        if: always()
        env:
          CACHE_HIT: ${{ steps.real-sample-package-cache.outputs.cache-hit }}
        run: |
          cache_hit="${CACHE_HIT:-false}"
          if [[ "${cache_hit}" == true ]]; then
            cache_status=hit
          else
            cache_status=miss
          fi
          {
            echo '## Real-sample package cache'
            echo
            echo "Cache status: **${cache_status}** (cache-hit=${cache_hit})"
            echo "Key scope: ${RUNNER_OS}/${RUNNER_ARCH}; Debian/APK archives and verified indexes only"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Select locked real-sample tier
        run: |
          case "${GITHUB_EVENT_NAME}" in
            pull_request) echo 'REAL_SAMPLE_TIER=pr' >> "$GITHUB_ENV" ;;
            release) echo 'REAL_SAMPLE_TIER=release' >> "$GITHUB_ENV" ;;
            schedule) echo 'REAL_SAMPLE_TIER=nightly' >> "$GITHUB_ENV" ;;
            workflow_dispatch)
              if [[ "${{ inputs.run_release_rehearsal }}" == true ]]; then
                echo 'REAL_SAMPLE_TIER=release' >> "$GITHUB_ENV"
              elif [[ "${{ inputs.run_nightly_rehearsal }}" == true ]]; then
                echo 'REAL_SAMPLE_TIER=nightly' >> "$GITHUB_ENV"
              else
                echo 'REAL_SAMPLE_TIER=pr' >> "$GITHUB_ENV"
              fi
              ;;
            *) echo 'REAL_SAMPLE_TIER=pr' >> "$GITHUB_ENV" ;;
          esac
      - name: Record isolated ARM64 runner environment
        run: |
          mkdir -p .artifacts/real-samples/runner
          ./.github/scripts/record-environment.sh \
            .artifacts/real-samples/runner/environment.txt \
            aarch64 public-real-sample-${REAL_SAMPLE_TIER}
      - name: Install bounded isolation and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap binutils curl dpkg-dev make musl-tools
          {
            echo "bubblewrap=$(bwrap --version)"
            echo "readelf=$(readelf --version | head -n 1)"
            echo "runner_arch=$(uname -m)"
            echo "docker=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')"
          } | tee -a .artifacts/real-samples/runner/environment.txt
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
      - name: Restore product
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build product
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      - name: Build static AArch64 outer launcher
        run: |
          make -C native/urprotect-launcher \
            CC=musl-gcc MUSL_REAL_CC=aarch64-linux-gnu-gcc \
            launcher check-elf
      - name: Recheck metadata without acquisition
        run: |
          python3 scripts/validate-real-samples.py \
            fixtures/real-samples/manifest.json \
            --candidates fixtures/real-samples/candidates.json \
            --tier "${REAL_SAMPLE_TIER}"
          python3 scripts/validate-runtime-closures.py \
            fixtures/real-samples/runtime-closures.json \
            fixtures/real-samples/manifest.json
      - name: Run required full approved real-sample suite
        env:
          REAL_SAMPLE_LAUNCHER: native/urprotect-launcher/build/urprotect-launcher
        run: |
          ./scripts/run-real-sample-matrix.sh --tier "${REAL_SAMPLE_TIER}"
      - name: Recheck retained real-sample evidence
        if: always()
        run: |
          python3 scripts/check-real-sample-evidence.py \
            fixtures/real-samples/manifest.json \
            --candidates fixtures/real-samples/candidates.json \
            --runtime-closures fixtures/real-samples/runtime-closures.json \
            --tier "${REAL_SAMPLE_TIER}" \
            --artifact-root ".artifacts/real-samples/${REAL_SAMPLE_TIER}"
      # The restore-only action above deliberately leaves saving explicit so a
      # completed-but-failing matrix still contributes verified cache entries.
      # Interrupted downloads are temporary .tmp files and must not enter the
      # shared cache.
      - name: Remove incomplete real-sample cache downloads
        if: always()
        run: |
          find "${RUNNER_TEMP}/urprotect-real-sample-package-cache/archives" \
            "${RUNNER_TEMP}/urprotect-real-sample-package-cache/indexes" \
            -type f -name '*.tmp' -delete 2>/dev/null || true
      - name: Save verified real-sample package and index cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/urprotect-real-sample-package-cache/archives
            ${{ runner.temp }}/urprotect-real-sample-package-cache/indexes
          key: real-sample-package-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fixtures/real-samples/runtime-closures.json', 'fixtures/real-samples/bionic-node-runtime-lock.json', 'fixtures/real-samples/manifest.json', 'scripts/build-runtime-closure.py', 'scripts/run-bionic-node-sample.sh') }}
      - name: Upload real-sample evidence (never raw inputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-samples-${{ env.REAL_SAMPLE_TIER }}-${{ github.run_id }}
          path: .artifacts/real-samples/
          if-no-files-found: error

  runtime-matrix-native-arm64:
    needs: [ci-event-gate, bionic-native-arm64]
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select runtime matrix tier
        env:
          RUN_RELEASE_FIXTURES: ${{ inputs.run_release_fixtures }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            pull_request) echo 'RUNTIME_MATRIX_TIER=pr' >> "$GITHUB_ENV" ;;
            release) echo 'RUNTIME_MATRIX_TIER=release' >> "$GITHUB_ENV" ;;
            workflow_dispatch)
              if [[ "${RUN_RELEASE_FIXTURES}" == true ]]; then
                echo 'RUNTIME_MATRIX_TIER=release' >> "$GITHUB_ENV"
              else
                echo 'RUNTIME_MATRIX_TIER=nightly' >> "$GITHUB_ENV"
              fi
              ;;
            *) echo 'RUNTIME_MATRIX_TIER=nightly' >> "$GITHUB_ENV" ;;
          esac
      - name: Record native AArch64 runtime matrix environment
        run: |
          mkdir -p ".artifacts/runtime-matrix/${RUNTIME_MATRIX_TIER}"
          ./.github/scripts/record-environment.sh \
            ".artifacts/runtime-matrix/${RUNTIME_MATRIX_TIER}/runner.txt" aarch64 runtime-covering-matrix
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock.json
      - name: Restore and build UrProtect for every runtime tier
        run: |
          dotnet restore UrProtect.sln --locked-mode
          dotnet build UrProtect.sln --configuration Release --no-restore
      - name: Install the pinned native musl toolchain for extended tiers
        if: env.RUNTIME_MATRIX_TIER != 'pr'
        env:
          RUNTIME_TOOLCHAIN_ARTIFACT_ROOT: .artifacts/runtime-matrix/${{ env.RUNTIME_MATRIX_TIER }}/package-locks/musl-1.2.4
        run: |
          chmod +x scripts/install-runtime-musl-toolchain.sh
          ./scripts/install-runtime-musl-toolchain.sh
      - uses: actions/download-artifact@v4
        with:
          name: bionic-native-arm64-${{ github.run_id }}
          path: .artifacts/bionic
      - name: Validate registry and run native/container covering set
        env:
          RUNTIME_MATRIX_ARTIFACT_ROOT: .artifacts/runtime-matrix/${{ env.RUNTIME_MATRIX_TIER }}
          BIONIC_MATRIX_ARTIFACT_ROOT: .artifacts/bionic/c-termux-bionic-pie
        run: ./scripts/run-runtime-matrix.sh "${RUNTIME_MATRIX_TIER}"
      - name: Hash final runtime and consumed bionic evidence
        if: always()
        run: |
          find ".artifacts/runtime-matrix/${RUNTIME_MATRIX_TIER}" .artifacts/bionic/c-termux-bionic-pie \
            -type f ! -path ".artifacts/runtime-matrix/${RUNTIME_MATRIX_TIER}/SHA256SUMS" -print0 | sort -z | xargs -0 sha256sum \
            > ".artifacts/runtime-matrix/${RUNTIME_MATRIX_TIER}/SHA256SUMS"
      - name: Recheck retained runtime matrix evidence
        if: always()
        run: python3 scripts/check-runtime-matrix-evidence.py "${RUNTIME_MATRIX_TIER}" ".artifacts/runtime-matrix/${RUNTIME_MATRIX_TIER}" .artifacts/bionic/c-termux-bionic-pie
      - name: Upload runtime matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-matrix-${{ env.RUNTIME_MATRIX_TIER }}-${{ github.run_id }}
          path: |
            .artifacts/runtime-matrix/
            .artifacts/bionic/
          if-no-files-found: error
          include-hidden-files: true

  bionic-native-arm64:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
      - name: Build protection CLI
        run: |
          dotnet restore UrProtect.sln --locked-mode
          dotnet build UrProtect.sln --configuration Release --no-restore
      - name: Record native bionic runner environment
        run: |
          mkdir -p .artifacts/bionic
          ./.github/scripts/record-environment.sh \
            .artifacts/bionic/runner-environment.txt \
            aarch64 native-arm64-bionic-container
      - name: Verify Docker runtime
        run: docker version
      - name: Capture bionic Node.js candidate lock (manual only; not compatibility evidence)
        if: github.event_name == 'workflow_dispatch' && inputs.capture_bionic_node_closure == true
        run: |
          set -euo pipefail
          candidate_root=.artifacts/bionic/c-termux-bionic-pie
          candidate_path="${candidate_root}/nodejs-candidate-lock.json"
          mkdir -p "${candidate_root}"
          python3 scripts/capture-bionic-node-closure.py \
            --docker-command "${BIONIC_CONTAINER_RUNTIME:-docker}" \
            --output "${candidate_path}"
          python3 scripts/capture-bionic-node-closure.py \
            --validate-candidate "${candidate_path}"
          if grep -Eiq 'accepted-and-runs|proven|runtime-failure' "${candidate_path}"; then
            echo 'candidate-lock metadata contains a compatibility result' >&2
            exit 1
          fi
          printf '%s\n' \
            'candidate-lock=true' \
            'runtimeEvidence=false' \
            'compatibilityStatus=not-established' \
            'rawArchives=temporary-only-and-removed' \
            'rawNodeBinary=not-captured' \
            > "${candidate_root}/nodejs-candidate-lock-status.txt"
      - name: Run native ARM64 bionic fixture
        env:
          BIONIC_PROTECTION_E2E: 'true'
        run: ./scripts/run-bionic-fixture.sh
      - name: Check native ARM64 bionic evidence
        run: |
          python3 scripts/check-evidence.py fixtures/manifest.json \
            --execution native-arm64-bionic-container
          python3 scripts/check-evidence.py fixtures/manifest.json \
            --feature runtime.bionic.linker
          python3 scripts/check-evidence.py fixtures/manifest.json \
            --feature runtime.host-context.bionic-handoff
          python3 scripts/check-protection-evidence.py \
            .artifacts/bionic/c-termux-bionic-pie --runtime bionic
      - name: Upload bionic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bionic-native-arm64-${{ github.run_id }}
          path: .artifacts/bionic/
          if-no-files-found: warn

  android-container-probe:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Android container prerequisites
        run: |
          set +e
          export ANDROID_CONTAINER_SYSTEM_IMAGE="${RUNNER_TEMP}/android-container/lineage-arm64-system.zip"
          export ANDROID_CONTAINER_VENDOR_IMAGE="${RUNNER_TEMP}/android-container/lineage-arm64-vendor.zip"
          export ANDROID_CONTAINER_SYSTEM_SHA256='c4b45fad36bee7c0db8a1d9315a5be0035520c53d3d005a807735ae9b7ee79cf'
          export ANDROID_CONTAINER_VENDOR_SHA256='1e6d33d464277ea3964e4658001c8882f21325616d6bcc66d473bc9ee1e246c7'
          ./.github/scripts/check-android-container.sh 2>&1 | tee android-container-probe.log
          probe_status=${PIPESTATUS[0]}
          if [[ "${probe_status}" -ne 0 ]]; then
            {
              echo '## Android container capability'
              echo
              echo 'The hosted ARM64 runner does not currently expose all Android container prerequisites.'
              echo 'This is an informational feasibility result; Android container E2E is not claimed or used as a gate.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Upload Android probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-container-probe-${{ github.run_id }}
          path: android-container-probe.log
          if-no-files-found: warn

  # Scheduled/release runs exercise this slow path; manual runs opt in explicitly.
  android-arm64-native-bridge-on-x64:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_android_native_bridge == true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Record Android host environment
        run: |
          mkdir -p .artifacts/android-arm64-native-bridge-on-x64
          ./.github/scripts/record-environment.sh \
            .artifacts/android-arm64-native-bridge-on-x64/host-environment.txt \
            x86_64 android-arm64-native-bridge-on-x64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android emulator host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          dpkg-query -W libpulse0 | tee android-emulator-host-dependencies.txt
      - name: Configure writable Android SDK root
        run: |
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
      - name: Cache Android SDK packages
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-sdk/cmdline-tools
            ${{ runner.temp }}/android-sdk/tools
            ${{ runner.temp }}/android-sdk/emulator
            ${{ runner.temp }}/android-sdk/platform-tools
            ${{ runner.temp }}/android-sdk/platforms/android-35
            ${{ runner.temp }}/android-sdk/build-tools/35.0.0
            ${{ runner.temp }}/android-sdk/cmake/3.22.1
            ${{ runner.temp }}/android-sdk/ndk/27.2.12479018
            ${{ runner.temp }}/android-sdk/system-images/android-35/google_apis/x86_64
          key: android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fixtures/manifest.json', 'scripts/run-android-avd.sh') }}
      - uses: android-actions/setup-android@v3
      - name: Record Android SDK cache status
        run: |
          {
            echo '## CI cache status'
            echo
            echo "Android SDK cache hit: \`${{ steps['android-sdk-cache'].outputs['cache-hit'] }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run arm64-v8a native-bridge E2E on x86_64 AVD
        run: ./scripts/run-android-avd.sh
      - name: Check Android native-bridge evidence
        run: |
          evidence_root=.artifacts/android-arm64-native-bridge-on-x64
          if [[ -f "${evidence_root}/logcat.txt" ]]; then
            python3 scripts/check-evidence.py fixtures/manifest.json \
              --execution android-arm64-native-bridge-on-x64
          elif grep -Fq 'ANDROID_AVD_UNAVAILABLE ' "${evidence_root}/run.log" 2>/dev/null; then
            echo 'Android native-bridge evidence is unavailable; the optional case is not claimed.'
          else
            echo 'Android native-bridge evidence is missing its execution witness.' >&2
            exit 1
          fi
      - name: Upload Android AVD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-native-bridge-on-x64-${{ github.run_id }}
          path: |
            .artifacts/android-arm64-native-bridge-on-x64/
            android-emulator-host-dependencies.txt
          if-no-files-found: warn

  fixture-nightly:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select fixture tier
        env:
          RUN_RELEASE_FIXTURES: ${{ inputs.run_release_fixtures }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == release || "${RUN_RELEASE_FIXTURES}" == true ]]; then
            echo 'FIXTURE_TIER=release' >> "$GITHUB_ENV"
          else
            echo 'FIXTURE_TIER=nightly' >> "$GITHUB_ENV"
          fi
      - name: Record runner environment
        run: |
          mkdir -p ".artifacts/fixtures/${FIXTURE_TIER}"
          ./.github/scripts/record-environment.sh \
            ".artifacts/fixtures/${FIXTURE_TIER}/environment-before-toolchains.txt" \
            aarch64 native-linux-fixture
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            tests/UrProtect.Fuzz/packages.lock.json
            third_party/SharpFuzzCompat/SharpFuzz/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Cache native ARM64 fixture toolchains
        id: native-fixture-toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/urprotect-fixture-toolchains
          key: native-fixture-toolchains-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-native-toolchains.sh') }}
      - name: Install pinned native ARM64 fixture toolchains
        run: |
          mkdir -p ".artifacts/fixtures/${FIXTURE_TIER}"
          ./scripts/install-native-toolchains.sh | tee ".artifacts/fixtures/${FIXTURE_TIER}/toolchains.txt"
      - name: Record provisioned toolchain environment
        run: |
          ./.github/scripts/record-environment.sh \
            ".artifacts/fixtures/${FIXTURE_TIER}/environment-after-toolchains.txt" \
            aarch64 native-linux-fixture
      - name: Record native fixture toolchain cache status
        run: |
          {
            echo '## Native fixture toolchain cache'
            echo
            echo "Cache hit: \`${{ steps['native-fixture-toolchain-cache'].outputs['cache-hit'] }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      - name: Run bounded parser fuzz target
        run: FUZZ_RESULTS_DIRECTORY=".artifacts/fixtures/${FIXTURE_TIER}/fuzz" ./scripts/run-parser-fuzz.sh
      - name: Run coverage-guided fuzz target
        run: FUZZ_RESULTS_DIRECTORY=".artifacts/fixtures/${FIXTURE_TIER}/coverage-fuzz" ./scripts/run-coverage-fuzz.sh --tier "${FIXTURE_TIER}"
      - name: Run amplified concurrency and large-input regressions
        run: STRESS_RESULTS_DIRECTORY=".artifacts/fixtures/${FIXTURE_TIER}/stress" ./scripts/run-regression-stress.sh --tier nightly
      - name: Run compiler and language fixture matrix
        run: ./scripts/run-fixture-matrix.sh --tier "${FIXTURE_TIER}"
      - name: Check nightly native Linux evidence
        if: env.FIXTURE_TIER == 'nightly'
        run: python3 scripts/check-evidence.py fixtures/manifest.json --tier nightly --execution native-linux
      - name: Check release native Linux evidence
        if: env.FIXTURE_TIER == 'release'
        run: python3 scripts/check-evidence.py fixtures/manifest.json --tier release --execution native-linux
      - name: Render selected regression matrix plan
        run: |
          mkdir -p ".artifacts/fixtures/${FIXTURE_TIER}/regression-matrix"
          python3 scripts/validate-regression-matrix.py tests/regression-matrix.json \
            --tier "${FIXTURE_TIER}" --emit > ".artifacts/fixtures/${FIXTURE_TIER}/regression-matrix/plan.json"
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ github.run_id }}
          path: .artifacts/fixtures/
          if-no-files-found: warn

  musl-container-smoke:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/dotnet/sdk@sha256:00c73d766c2c8fea23a9214954a5dec33c022c1a530c09e0f2a5e333fa4578ed
      options: --user root
    env:
      URPROTECT_CONTAINER_IMAGE: mcr.microsoft.com/dotnet/sdk@sha256:00c73d766c2c8fea23a9214954a5dec33c022c1a530c09e0f2a5e333fa4578ed
    steps:
      - name: Bootstrap source and musl tools
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash binutils ca-certificates coreutils file git \
            make musl=1.2.3-1 musl-dev=1.2.3-1 musl-tools=1.2.3-1 python3
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"
      - name: Record musl container environment
        run: |
          mkdir -p .artifacts/musl-container
          ./.github/scripts/record-environment.sh \
            .artifacts/musl-container/environment.txt \
            aarch64 native-linux-musl-container
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      - name: Run required musl protection smoke
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          PROTECTION_ARTIFACT_ROOT=.artifacts/musl-container/protection \
            ./scripts/run-protection-e2e.sh --tier "${tier}" --runtime musl
      - name: Check musl protection evidence
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) tier=nightly ;;
            release) tier=release ;;
            *) tier=pr ;;
          esac
          python3 scripts/check-protection-evidence.py \
            .artifacts/musl-container/protection --tier "${tier}" --runtime musl
      - name: Run musl container smoke
        run: ./scripts/run-musl-container-smoke.sh
      - name: Upload musl container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musl-container-${{ github.run_id }}
          path: .artifacts/musl-container/
          if-no-files-found: warn

  benchmark:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record runner environment
        run: |
          mkdir -p .artifacts/benchmark
          ./.github/scripts/record-environment.sh \
            .artifacts/benchmark/environment.txt \
            aarch64 native-linux-benchmark
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "fixture_manifest_sha256=$(sha256sum fixtures/manifest.json | cut -d' ' -f1)"
          } > .artifacts/benchmark/metadata.txt
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - run: dotnet restore UrProtect.sln --locked-mode
      - run: dotnet run --project benchmarks/UrProtect.Benchmarks --configuration Release --no-restore | tee .artifacts/benchmark/results.txt
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            .artifacts/benchmark/
            BenchmarkDotNet.Artifacts/
            benchmarks/UrProtect.Benchmarks/BenchmarkDotNet.Artifacts/
          if-no-files-found: warn

  release-package:
    needs: ci-event-gate
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_release_rehearsal == true)) }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/UrProtect.Core/packages.lock.json
            src/UrProtect.Cli/packages.lock.json
            tests/UrProtect.Core.Tests/packages.lock.json
            benchmarks/UrProtect.Benchmarks/packages.lock.json
      - name: Resolve product version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == release ]]; then
            tag="${RELEASE_TAG}"
            version="${tag#v}"
          else
            version='0.2.0'
          fi
          echo "URPROTECT_VERSION=${version}" >> "$GITHUB_ENV"
          echo "release_version=${version}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned native launcher toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make musl=1.2.4-2 musl-dev=1.2.4-2 musl-tools=1.2.4-2
      - name: Restore
        run: dotnet restore UrProtect.sln --locked-mode
      - name: Build
        run: dotnet build UrProtect.sln --configuration Release --no-restore
      - name: Package glibc and musl bundles
        run: ./scripts/package-release.sh "${URPROTECT_VERSION}" .artifacts/release
      - name: Smoke test release bundles
        env:
          URPROTECT_MUSL_CONTAINER_IMAGE: mcr.microsoft.com/dotnet/sdk@sha256:386b8fd9f78bb9aa7e5fb566656e0903518cb6f81d3b1520e1787a7dce1ef243
          RELEASE_SMOKE_ARTIFACT_ROOT: .artifacts/release/smoke
        run: ./scripts/release-smoke.sh .artifacts/release
      - name: Publish GitHub release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" .artifacts/release/* --clobber
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: .artifacts/release/
          if-no-files-found: warn

  # Keep the job ID for required status checks, but only verify real
  # compatibility evidence. Scheme-A artificial attack scoring is retired.
  independent-evaluator:
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (!cancelled()) }}
    needs:
      - ci-event-gate
      - strict-compatibility-shard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download strict compatibility shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: strict-compatibility-shard-*-${{ github.run_id }}
          path: .artifacts/shards/
      - name: Select compatibility evidence tier
        shell: bash
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule) echo 'EVIDENCE_TIER=nightly' >> "$GITHUB_ENV" ;;
            release) echo 'EVIDENCE_TIER=release' >> "$GITHUB_ENV" ;;
            workflow_dispatch)
              if [[ "${{ inputs.run_release_rehearsal }}" == true ]]; then
                echo 'EVIDENCE_TIER=release' >> "$GITHUB_ENV"
              elif [[ "${{ inputs.run_nightly_rehearsal }}" == true ]]; then
                echo 'EVIDENCE_TIER=nightly' >> "$GITHUB_ENV"
              else
                echo 'EVIDENCE_TIER=pr' >> "$GITHUB_ENV"
              fi
              ;;
            *) echo 'EVIDENCE_TIER=pr' >> "$GITHUB_ENV" ;;
          esac
      - name: Merge strict shard evidence without losing provenance
        shell: bash
        run: |
          set -euo pipefail
          destination=".artifacts/strict-corpus-merge/${EVIDENCE_TIER}/glibc"
          mkdir -p "$destination"
          for shard in 0 1 2 3; do
            root=".artifacts/shards/strict-compatibility-shard-${shard}-${GITHUB_RUN_ID}/${EVIDENCE_TIER}/glibc"
            [[ -d "$root" && ! -L "$root" ]] || { echo "missing strict shard $shard" >&2; exit 1; }
            cp -a -- "$root/." "$destination/"
          done
      - name: Validate compatibility-only checker and workflow contracts
        run: |
          python3 -m unittest discover -s tests -p test_strict_product_corpus.py -v
          python3 -m unittest discover -s tests -p test_protected_image_workflow.py -v
      - name: Independently verify 100 strict products and four shard summaries
        run: |
          python3 scripts/check-strict-product-corpus.py \
            --tier "${EVIDENCE_TIER}" --runtime glibc --shard-count 4 \
            --evidence-root ".artifacts/strict-corpus-merge/${EVIDENCE_TIER}/glibc" \
            --output ".artifacts/compatibility-verification/${EVIDENCE_TIER}/report.json"
      - name: Upload independent compatibility verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-verification-${EVIDENCE_TIER}-${{ github.run_id }}
          path: .artifacts/compatibility-verification/
          include-hidden-files: true
          if-no-files-found: warn

  # A lightweight terminal barrier, not an evaluator. Every required producer and
  # evaluator remains a hard gate. Platform jobs remain conditional on event.
  ci-quality-gate:
    # Still enforce fail-closed results on failed jobs; never prolong a
    # workflow explicitly cancelled by a superseding revision.
    if: ${{ needs['ci-event-gate'].outputs.run_full == 'true' && (!cancelled()) }}
    needs:
      - ci-event-gate
      - build-and-test
      - managed-tests
      - protection-and-tls
      - fixture-and-pack
      - native-host-context
      - coverage-fuzz
      - strict-compatibility-shard
      - independent-evaluator
      - real-sample-matrix
      - runtime-matrix-native-arm64
      - bionic-native-arm64
      - musl-container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs['build-and-test'].result }}
      MANAGED_RESULT: ${{ needs['managed-tests'].result }}
      PROTECTION_RESULT: ${{ needs['protection-and-tls'].result }}
      FIXTURE_RESULT: ${{ needs['fixture-and-pack'].result }}
      HOST_CONTEXT_RESULT: ${{ needs['native-host-context'].result }}
      FUZZ_RESULT: ${{ needs['coverage-fuzz'].result }}
      SHARDS_RESULT: ${{ needs['strict-compatibility-shard'].result }}
      EVALUATOR_RESULT: ${{ needs['independent-evaluator'].result }}
      REAL_SAMPLE_RESULT: ${{ needs['real-sample-matrix'].result }}
      RUNTIME_RESULT: ${{ needs['runtime-matrix-native-arm64'].result }}
      BIONIC_RESULT: ${{ needs['bionic-native-arm64'].result }}
      MUSL_RESULT: ${{ needs['musl-container-smoke'].result }}
    steps:
      - name: Require every mandatory validation result
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${BUILD_RESULT}" \
            "${MANAGED_RESULT}" \
            "${PROTECTION_RESULT}" \
            "${FIXTURE_RESULT}" \
            "${HOST_CONTEXT_RESULT}" \
            "${FUZZ_RESULT}" \
            "${SHARDS_RESULT}" \
            "${EVALUATOR_RESULT}"; do
            if [[ "${result}" != success ]]; then
              echo "FAIL mandatory CI lane: observed ${result}" >&2
              exit 1
            fi
          done
          if [[ "${GITHUB_EVENT_NAME}" != push ]]; then
            for result in \
              "${REAL_SAMPLE_RESULT}" \
              "${RUNTIME_RESULT}" \
              "${BIONIC_RESULT}" \
              "${MUSL_RESULT}"; do
              if [[ "${result}" != success ]]; then
                echo "FAIL required platform CI lane: observed ${result}" >&2
                exit 1
              fi
            done
          fi
          echo 'PASS: all mandatory verification lanes and independent evaluator succeeded'
