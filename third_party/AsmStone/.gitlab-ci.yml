image: mcr.microsoft.com/dotnet/sdk:8.0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - verify
  - exhaustive
  - package

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key: "nuget-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

default:
  interruptible: true
  before_script:
    - dotnet --info

build-and-test:
  stage: verify
  script:
    - dotnet restore AsmStone.sln --nologo
    - dotnet build AsmStone.sln --configuration Release --no-restore --nologo
    - dotnet run --project tests/AsmStone.Tests/AsmStone.Tests.csproj --configuration Release --no-build --nologo
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - src/AsmStone/bin/Release/
      - tests/AsmStone.Tests/bin/Release/
      - tests/AsmStone.Exhaustive/bin/Release/
      - tools/AsmStone.Generator/bin/Release/

exhaustive-semantic-diff:
  stage: exhaustive
  tags:
    - saas-linux-2xlarge-amd64
  interruptible: false
  timeout: 4h
  cache:
    key:
      files:
        - spec/source-lock.json
    paths:
      - build/llvm/
      - build/llvm-oracle/
    policy: pull-push
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build-and-test
      artifacts: true
  script:
    - apt-get update
    - apt-get install --no-install-recommends -y ca-certificates cmake g++ git ninja-build python3
    - git config --global http.version HTTP/1.1
    - scripts/fetch-sources.sh third_party
    - LLVM_BUILD_JOBS=32 scripts/build-llvm-oracle.sh third_party/llvm build/llvm build/llvm-oracle
    - test -x build/llvm-oracle/asmstone-llvm-oracle
    - mkdir -p artifacts
    - export EXHAUSTIVE_WORKERS=32
    - |
      set -o pipefail
      worker() {
        worker_index="$1"
        CI_NODE_INDEX="$worker_index" CI_NODE_TOTAL="$EXHAUSTIVE_WORKERS" \
          dotnet exec tests/AsmStone.Exhaustive/bin/Release/net8.0/AsmStone.Exhaustive.dll \
            --oracle="$CI_PROJECT_DIR/build/llvm-oracle/asmstone-llvm-oracle" \
            --chunk-size=1048576 --no-progress 2>&1 \
            | tee "artifacts/worker-${worker_index}.log"
      }
      export -f worker
      seq 1 "$EXHAUSTIVE_WORKERS" \
        | xargs -r -n1 -P"$EXHAUSTIVE_WORKERS" bash -c 'worker "$1"' _
    - |
      test "$(grep -l '^AsmStone.Exhaustive: PASS ' artifacts/worker-*.log | wc -l)" -eq "$EXHAUSTIVE_WORKERS"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/worker-*.log

package:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true
  script:
    - mkdir -p artifacts/packages
    - dotnet restore AsmStone.sln --nologo
    - dotnet pack src/AsmStone/AsmStone.csproj --configuration Release --no-restore --nologo --output artifacts/packages
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/packages/*.nupkg
